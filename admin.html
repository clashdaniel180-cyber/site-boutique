<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Boutique do Turismo</title>
<style>
:root{--ink:#17120f;--br:#3b2a22;--gd:#a8892f;--ch:#efe4d0;--of:#faf6ee;--ln:rgba(59,42,34,.18)}
*{box-sizing:border-box;margin:0}body{background:#f6f1e7;color:var(--br);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:var(--ink)}
.b{display:inline-block;padding:11px 18px;border:1px solid var(--gd);background:none;color:var(--ink);cursor:pointer;font:500 13px system-ui;letter-spacing:.04em}
.b.f{background:var(--gd);color:#fff}.b:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.b.s{padding:6px 10px;font-size:12px;margin:2px}
.lg{max-width:380px;margin:14vh auto;background:#fff;padding:32px;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.08)}.lg h1{margin-bottom:10px}
label{display:block;font-size:13px;margin:12px 0 4px}input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--ln);font:inherit;background:#fff;color:var(--ink)}
.er{color:#a02020;font-size:14px;min-height:20px;margin:8px 0}
.top{background:var(--ink);color:#e6d9c1;padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.top h1{color:#fff;font-size:22px;margin-right:auto}
.top button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;padding:6px 4px}.top button.on{color:#c9a850;border-bottom:1px solid #c9a850}
main{max-width:1100px;margin:0 auto;padding:26px 18px}.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.cd div,.bx{background:#fff;border-radius:6px;padding:18px;box-shadow:0 2px 12px rgba(59,42,34,.07)}.cd b{display:block;font:600 34px/1 Georgia,serif;color:var(--gd)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{max-width:280px}.tools select{width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--ln)}.tw{overflow-x:auto}
.st{padding:2px 10px;border-radius:20px;font-size:12px;background:var(--ch)}.st.p{background:#d8ecd9;color:#1f5a2c}
#mdl .mb{position:fixed;inset:0;background:rgba(15,10,8,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
#mdl .mc{background:#fff;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:24px;border-radius:6px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ck{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.ck label{display:flex;gap:6px;align-items:center;margin:0}.ck input{width:auto}
.ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;display:none;z-index:20}.ts.on{display:block}
@media(max-width:700px){.cd,.r2{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div><div id="mdl"></div><div class="ts" id="ts"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var C=window.SB,$=function(i){return document.getElementById(i)},app=$("app"),M=$("mdl"),items=[],cfg={},sq="",sf="todos",tab="pk",cb=null,sb=null;
var TAGS=["Europa","Ásia","África","América","Cruzeiros","Experiências exclusivas"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var e=$("ts");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},3200)}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function lines(s){return s.split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function find(id){return items.filter(function(x){return x.id==id})[0]}
function login(m){app.innerHTML='<form class="lg" id="lf"><h1>Painel</h1><p>Boutique do Turismo by Camila</p><label>E-mail</label><input id="em" type="email" required autocomplete="username"><label>Senha</label><input id="pw" type="password" required autocomplete="current-password"><div class="er">'+esc(m||"")+'</div><button class="b f">Entrar</button></form>';
$("lf").onsubmit=async function(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(r.error)return login("E-mail ou senha incorretos.");enter()}}
async function enter(){var a=await sb.from("admins").select("user_id").limit(1);if(a.error||!a.data||!a.data.length){await sb.auth.signOut();return login("Esta conta não tem permissão de administrador.")}await load();shell()}
async function load(){var p=await sb.from("packages").select("id,status,data").order("id");items=(p.data||[]).map(function(r){return Object.assign({},r.data,{id:r.id,status:r.status})});var c=await sb.from("site_config").select("data").eq("id","site").maybeSingle();cfg=(c.data&&c.data.data)||{}}
function shell(){var pub=items.filter(function(x){return x.status=="publicado"}).length;
var h='<div class="top"><h1>Boutique do Turismo · Painel</h1><button data-a="tab" data-t="pk" class="'+(tab=="pk"?"on":"")+'">Pacotes</button><button data-a="tab" data-t="cfg" class="'+(tab=="cfg"?"on":"")+'">Configurações</button><a href="index.html" style="color:inherit">Ver o site</a><button data-a="out">Sair</button></div><main>';
if(tab=="pk"){var r=items.filter(function(p){return(sf=="todos"||p.status==sf)&&((p.nome||"")+" "+(p.pais||"")).toLowerCase().indexOf(sq.toLowerCase())>-1});
h+='<div class="cd"><div><b>'+items.length+'</b>pacotes</div><div><b>'+pub+'</b>publicados</div><div><b>'+(items.length-pub)+'</b>rascunhos</div></div><div class="tools"><input id="sq" type="search" placeholder="Buscar pacote" value="'+esc(sq)+'"><select id="sf"><option value="todos">Todos</option><option value="publicado"'+(sf=="publicado"?" selected":"")+'>Publicados</option><option value="rascunho"'+(sf=="rascunho"?" selected":"")+'>Rascunhos</option></select><button class="b f" data-a="new">Novo pacote</button></div><div class="bx tw">';
h+=r.length?'<table><tr><th>Pacote</th><th>Destino</th><th>Preço</th><th>Status</th><th></th></tr>'+r.map(function(p){return"<tr><td>"+esc(p.curto||p.nome)+"</td><td>"+esc(p.pais)+"</td><td>"+(p.preco?"R$ "+Number(p.preco).toLocaleString("pt-BR"):"Consulte")+'</td><td><span class="st '+(p.status=="publicado"?"p":"")+'">'+esc(p.status)+'</span></td><td><button class="b s" data-a="edit" data-id="'+esc(p.id)+'">Editar</button><button class="b s" data-a="tog" data-id="'+esc(p.id)+'">'+(p.status=="publicado"?"Despublicar":"Publicar")+'</button><button class="b s" data-a="del" data-id="'+esc(p.id)+'">Excluir</button></td></tr>'}).join("")+"</table>":"<p>Nenhum pacote encontrado.</p>";h+="</div>"}
else h+='<div class="bx" style="max-width:520px"><h2>Configurações</h2><label>WhatsApp com DDI (somente números)</label><input id="c_wa" value="'+esc(cfg.wa||"")+'"><label>Endereço</label><input id="c_end" value="'+esc(cfg.endereco||"")+'"><p style="margin-top:16px"><button class="b f" data-a="scfg">Salvar</button></p></div>';
app.innerHTML=h+"</main>"}
function F(l,i,v,t){return"<label>"+l+'</label><input id="'+i+'" type="'+(t||"text")+'" value="'+esc(v)+'">'}
function TA(l,i,v,n){return"<label>"+l+'</label><textarea id="'+i+'" rows="'+(n||3)+'">'+esc(v)+"</textarea>"}
function form(id){var p=id?find(id):{tags:[],status:"rascunho",a:"#c9a850",b:"#3b2a22"};
M.innerHTML='<div class="mb"><div class="mc"><h2>'+(id?"Editar pacote":"Novo pacote")+"</h2>"+F("Nome do pacote *","f_nome",p.nome||"")+'<div class="r2"><div>'+F("Nome curto","f_curto",p.curto||"")+"</div><div>"+F("País ou região *","f_pais",p.pais||"")+'</div></div><label>Categorias *</label><div class="ck">'+TAGS.map(function(t){return'<label><input type="checkbox" class="tg" value="'+t+'"'+((p.tags||[]).indexOf(t)>-1?" checked":"")+">"+t+"</label>"}).join("")+'</div><div class="r2"><div>'+F("Duração","f_dur",p.dur||"")+"</div><div>"+F("Data de saída","f_saida",p.saida||"")+"</div><div>"+F("Preço por pessoa (R$)","f_preco",p.preco||"","number")+"</div><div>"+F("Parcelamento","f_parc",p.parc||"")+"</div><div>"+F("Cor 1","f_a",p.a||"#c9a850","color")+"</div><div>"+F("Cor 2","f_b",p.b||"#3b2a22","color")+"</div></div>"+F("Frase de apoio","f_sub",p.sub||"")+TA("Descrição","f_desc",p.desc||"")+F("Imagem principal (endereço https://…)","f_img",p.img||"")+TA("Incluso (um por linha)","f_inc",(p.inc||[]).join("\n"))+TA("Não incluso (um por linha)","f_nao",(p.nao||[]).join("\n"))+TA("Roteiro (Título :: descrição, uma linha por dia)","f_rot",(p.rot||[]).map(function(x){return x[0]+" :: "+x[1]}).join("\n"),4)+TA("Galeria (um título por linha)","f_gal",(p.gal||[]).join("\n"))+'<div class="ck"><label><input type="checkbox" id="f_demo"'+(p.demo?" checked":"")+'>Preço demonstrativo</label><label><input type="checkbox" id="f_dest"'+(p.destaque?" checked":"")+'>Destaque</label><label>Status <select id="f_st" style="width:auto"><option value="rascunho">Rascunho</option><option value="publicado"'+(p.status=="publicado"?" selected":"")+'>Publicado</option></select></label></div><div class="er" id="fe"></div><p><button class="b f" data-a="save" data-id="'+esc(id||"")+'">Salvar</button> <button class="b" data-a="x">Cancelar</button></p></div></div>'}
function conf(t,fn){cb=fn;M.innerHTML='<div class="mb"><div class="mc" style="max-width:420px"><p>'+esc(t)+'</p><p style="margin-top:16px"><button class="b f" data-a="yes">Confirmar</button> <button class="b" data-a="x">Cancelar</button></p></div></div>'}
function v(i){return $(i).value}
async function put(o){return sb.from("packages").upsert({id:o.id,status:o.status,data:o,updated_at:new Date().toISOString()})}
async function save(id){var nome=v("f_nome").trim(),pais=v("f_pais").trim(),pr=v("f_preco").trim(),tags=[].map.call(M.querySelectorAll(".tg:checked"),function(x){return x.value}),er=[],nid=id||slug(nome);
if(!nome)er.push("Informe o nome.");if(!pais)er.push("Informe o país ou região.");if(!tags.length)er.push("Escolha ao menos uma categoria.");if(pr&&!(Number(pr)>=0))er.push("Preço inválido.");if(!id&&nid&&find(nid))er.push("Já existe um pacote com este nome.");
var img=v("f_img").trim();if(img&&!/^https:\/\//.test(img))er.push("A imagem deve começar com https://");
if(er.length){$("fe").textContent=er.join(" ");return}
var o={id:nid,nome:nome,curto:v("f_curto").trim(),pais:pais,tags:tags,dur:v("f_dur").trim(),saida:v("f_saida").trim(),parc:v("f_parc").trim(),sub:v("f_sub").trim(),desc:v("f_desc").trim(),a:v("f_a"),b:v("f_b"),img:img,demo:$("f_demo").checked,destaque:$("f_dest").checked,status:v("f_st")};
var i=lines(v("f_inc")),n=lines(v("f_nao")),r=lines(v("f_rot")).map(function(l){var a=l.split("::");return[a[0].trim(),(a[1]||"").trim()]}),g=lines(v("f_gal"));if(i.length)o.inc=i;if(n.length)o.nao=n;if(r.length)o.rot=r;if(g.length)o.gal=g;if(pr)o.preco=Number(pr);
var res=await put(o);if(res.error){$("fe").textContent="Não foi possível salvar. Entre de novo e tente outra vez.";return}M.innerHTML="";toast("Pacote salvo.");await load();shell()}
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(a=="x")M.innerHTML="";else if(a=="tab"){tab=b.dataset.t;shell()}else if(a=="out"){await sb.auth.signOut();login()}else if(a=="new")form();else if(a=="edit")form(id);else if(a=="save")save(id);
else if(a=="tog"){var p=find(id);p.status=p.status=="publicado"?"rascunho":"publicado";var r=await put(p);toast(r.error?"Não foi possível alterar.":"Status atualizado.");await load();shell()}
else if(a=="del"){var q=find(id);conf("Excluir “"+q.nome+"”? Esta ação não pode ser desfeita.",async function(){var r=await sb.from("packages").delete().eq("id",id);toast(r.error?"Não foi possível excluir.":"Pacote excluído.");await load();shell()})}
else if(a=="yes"){M.innerHTML="";if(cb)await cb()}
else if(a=="scfg"){var w=v("c_wa").replace(/\D/g,"");if(w&&w.length<12)return toast("Informe o número com DDI e DDD.");var r2=await sb.from("site_config").upsert({id:"site",data:{wa:w,endereco:v("c_end").trim()}});toast(r2.error?"Não foi possível salvar.":"Configurações salvas.");await load()}});
document.addEventListener("input",function(e){if(e.target.id=="sq"){sq=e.target.value;var c=e.target.selectionStart;shell();var n=$("sq");n.focus();n.setSelectionRange(c,c)}});
document.addEventListener("change",function(e){if(e.target.id=="sf"){sf=e.target.value;shell()}});
if(!C||!C.key||C.key.indexOf("COLE")==0||typeof supabase=="undefined"){app.innerHTML='<div class="lg"><h1>Configuração pendente</h1><p>Cole a chave anon do Supabase no arquivo config.js.</p></div>'}
else{sb=supabase.createClient(C.url,C.key);sb.auth.getSession().then(function(s){if(s.data.session)enter();else login()})}
</script></body></html>
